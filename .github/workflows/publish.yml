name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: Zigbee release channel to test (does not publish a release)
        type: choice
        options: [dev, stable]
        default: dev

permissions:
  contents: read

jobs:
  package:
    name: Build Wiser with a published Zigbee card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test Zigbee release selection
        run: python -m unittest discover -s tests -p test_zigbee_release.py
      - name: Stage integration
        run: |
          mkdir -p dist/wiser
          cp -a custom_components/wiser/. dist/wiser/
      - name: Fetch Zigbee release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARD_CHANNEL: ${{ github.event_name == 'release' && (github.event.release.prerelease && 'dev' || 'stable') || inputs.channel || 'dev' }}
          ZIGBEE_REPOSITORY: ${{ vars.WISER_ZIGBEE_CARD_REPOSITORY || 'andyblac/wiser-zigbee-card' }}
        run: >-
          python scripts/fetch_zigbee_release.py
          --channel "$CARD_CHANNEL"
          --repository "$ZIGBEE_REPOSITORY"
      - name: Package integration
        working-directory: dist/wiser
        run: zip -r ../wiser.zip . -x '*/__pycache__/*' '*.pyc'
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiser-package
          path: |
            dist/wiser.zip
            dist/wiser/frontend/zigbee-release.json
          if-no-files-found: error

  publish:
    name: Attach package to published release
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wiser-package
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/wiser.zip
          fail_on_unmatched_files: true
